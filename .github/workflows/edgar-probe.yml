name: One-off reachability probe

# 一次性验证 runner 能直连哪些外部数据源(EDGAR、免费日线源…)。
# 沙箱出网被代理挡住,runner 是唯一能回答这个问题的机器。
# 本仓公开 → Actions 免费,单次约 1 分钟;仅手动触发,无计划任务、无月成本。
on:
  workflow_dispatch:
    inputs:
      script:
        description: 'scripts/ 下要跑的探针文件名'
        default: 'edgar-probe.mjs'
        required: true

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node "scripts/${{ inputs.script }}"
