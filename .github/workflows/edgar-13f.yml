name: Fetch 13F line-by-line from EDGAR

# 季度性:13F 截止日次日跑(与 ops-13f.yml 同节奏),把申报原文的逐笔持仓落成 JSON。
# 本仓公开 → Actions 免费;单次约 1 分钟,月成本 0。
on:
  schedule:
    - cron: '10 7 16 2,5 *'
    - cron: '10 7 15 8,11 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/edgar-13f.mjs
      - name: Commit if changed
        run: |
          git config user.name 'Claude'
          git config user.email 'noreply@anthropic.com'
          git add lib/data/13f-edgar.json
          git diff --cached --quiet || git commit -m "chore: 13F line-by-line refresh from EDGAR"
          git push
