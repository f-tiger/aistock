name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  cloudflare-pages:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy token
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN secret 未设置——跳过部署。到 dash.cloudflare.com/profile/api-tokens 创建含「Cloudflare Pages: Edit」权限的 token,存为仓库 Secret 即启用自动部署。"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build (static export)
        if: steps.token.outputs.present == 'true'
        env:
          # 并入 agiscorecard 域(站长指令 2026-08-08):canonical/sitemap/og 全部指向新域。
          NEXT_PUBLIC_SITE_URL: https://compass.agiscorecard.com
        run: npm run build

      - name: Ensure Pages project exists
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Idempotent: fails harmlessly if the project already exists.
        run: npx -y wrangler@latest pages project create ai-investing-compass --production-branch main || true

      - name: Deploy to Cloudflare Pages (production)
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # wrangler reads wrangler.toml: output dir, SUBSCRIBERS KV binding, and
        # bundles functions/ as Pages Functions automatically.
        run: npx -y wrangler@latest pages deploy out --project-name ai-investing-compass --branch main --commit-hash "${{ github.sha }}"

      - name: Attach custom domain compass.agiscorecard.com (idempotent)
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Pages 自定义域 API 不会自动建 DNS(与 dashboard 不同),所以两步都做:
        # ①把域挂到 Pages 项目 ②在 zone 里建代理 CNAME → pages.dev。两步都幂等,
        # 已存在时的报错不影响已生效配置;continue-on-error 保证部署本身不被阻塞。
        run: |
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          # 本仓的 CLOUDFLARE_ACCOUNT_ID secret 为空(2026-08-08 部署日志实测),
          # wrangler 能从 token 推断账号但裸 API 不能——所以自己反查。
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(curl -s "$api/accounts" -H "$auth" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
            echo "derived account id: ${CLOUDFLARE_ACCOUNT_ID:0:6}…"
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "no account id derivable — skip"; exit 0; fi
          echo "== attach domain to Pages project =="
          curl -s -X POST "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/ai-investing-compass/domains" \
            -H "$auth" -H "Content-Type: application/json" \
            --data '{"name":"compass.agiscorecard.com"}' | head -c 600; echo
          echo "== ensure DNS CNAME =="
          zid=$(curl -s "$api/zones?name=agiscorecard.com" -H "$auth" | python3 -c "import json,sys;r=json.load(sys.stdin).get('result') or [];print(r[0]['id'] if r else '')")
          if [ -z "$zid" ]; then echo "zone lookup failed — token may lack Zone:Read on agiscorecard.com"; exit 0; fi
          n=$(curl -s "$api/zones/$zid/dns_records?name=compass.agiscorecard.com" -H "$auth" | python3 -c "import json,sys;print(len(json.load(sys.stdin).get('result') or []))")
          if [ "$n" = "0" ]; then
            curl -s -X POST "$api/zones/$zid/dns_records" -H "$auth" -H "Content-Type: application/json" \
              --data '{"type":"CNAME","name":"compass","content":"ai-investing-compass.pages.dev","proxied":true}' | head -c 600; echo
          else
            echo "DNS record already present ($n)"
          fi
          echo "== probe (first cert issuance can take minutes; non-blocking) =="
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://compass.agiscorecard.com/" || echo 000)
          echo "compass.agiscorecard.com HTTP $code"

      - name: Ping IndexNow (fast search indexing)
        if: steps.token.outputs.present == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # 部署后自检:新页真的在线上活着,而不是只在本地 build 里存在。
      # 只做正确性校验、不产生外部副作用,符合「push 路径只留校验/构建/部署/自检」。
      # Pages 传播有延迟,所以重试而不是一次判死(2026-08-11 在姊妹仓踩过一次)。
      - name: Smoke-test the live site
        if: steps.token.outputs.present == 'true'
        run: |
          fail=0
          for path in "/zh/track-record" "/en/track-record" "/llms.txt"; do
            ok=0
            for i in $(seq 1 10); do
              # -L 是必须的:next.config.mjs 开了 trailingSlash,/zh/track-record 会 308
              # 到 /zh/track-record/。第一版漏了它,于是在一个完全健康的站点上红了 15 分钟。
              body=$(curl -sSL --max-time 15 "https://compass.agiscorecard.com$path" || true)
              case "$path" in
                */track-record) needle="Druckenmiller\|德鲁肯米勒" ;;
                *) needle="Copy-Homework Scorecard" ;;
              esac
              if printf '%s' "$body" | grep -q "$needle"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" = 1 ]; then echo "✅ $path"; else echo "❌ $path 未在 ~50s 内出现预期内容"; fail=1; fi
          done
          exit $fail
