name: Daily data refresh

# 每日行情快照刷新(站长指令 2026-08-08:子站必须每天自己变新鲜,不依赖人工/外部 Agent)。
# 纯确定性:拉 Yahoo 行情 → 写 lib/data/market-snapshot.json → 提交 main → dispatch 部署。
# 副作用同样重要:每日 bot 提交保持仓库活跃,GitHub 不会因 60 天不活跃而停掉全部定时任务。
#
# 关键坑(别改错):GITHUB_TOKEN 的 push 不会触发其它 workflow(防递归),
# 但 workflow_dispatch 是官方例外——所以 push 后必须显式 dispatch deploy.yml。

on:
  schedule:
    # 21:23 UTC ≈ 北京 05:23,美股收盘后;错开整点提高 GitHub cron 准时率
    - cron: '23 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Fetch quotes → snapshot
        run: node scripts/daily-refresh.mjs

      - name: Detect change
        id: diff
        run: |
          if git diff --quiet lib/data/market-snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "snapshot unchanged (market closed / same day rerun) — nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat lib/data/market-snapshot.json
          fi

      - name: Build guard (bad data must not reach main)
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm ci
          npm run build

      - name: Commit & push snapshot
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/market-snapshot.json
          git commit -m "每日行情快照 $(date -u +%F)"
          git push origin HEAD:main

      - name: Dispatch deploy
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
